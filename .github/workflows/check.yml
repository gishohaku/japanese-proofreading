name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # textlint の設定と辞書が壊れていないことを、サンプル原稿で確認する
      - name: Run textlint on example
        run: python3 skills/japanese-proofreading/scripts/lint.py examples/sample.md
      - name: Run consistency check on example
        run: python3 skills/japanese-proofreading/scripts/consistency.py examples/sample.md
      - name: Regression test
        run: python3 tests/check_regression.py
      - name: Package skill
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: japanese-proofreading-skill
          path: dist/japanese-proofreading.skill
