version: 1
# 校正ルール（references/checklist.md の「表記方針の既定値」と rules/）のうち、文字列一致で安全に検出できるもの
rules:
  # OKURI-01 送り仮名の誤り
  - expected: '必ず'
    pattern: '必らず'
    prh: 'OKURI-01 送り仮名の誤り'
  - expected: '少なく'
    pattern: '/少く(?=な)/'
    prh: 'OKURI-01 送り仮名の誤り'
  - expected: '短い'
    pattern: '短かい'
    prh: 'OKURI-01 送り仮名の誤り'
  - expected: '新しい'
    pattern: '新らしい'
    prh: 'OKURI-01 送り仮名の誤り'
  - expected: '美しい'
    pattern: '美くしい'
    prh: 'OKURI-01 送り仮名の誤り'
  - expected: '著しい'
    pattern: '著るしい'
    prh: 'OKURI-01 送り仮名の誤り'
  - expected: '確かめ'
    pattern: '確め'
    prh: 'OKURI-01 送り仮名の誤り'
  - expected: '承る'
    pattern: '承わる'
    prh: 'OKURI-01 送り仮名の誤り'
  - expected: '携わ'
    pattern: '携さわ'
    prh: 'OKURI-01 送り仮名の誤り'
  - expected: '珍しい'
    pattern: '珍らしい'
    prh: 'OKURI-01 送り仮名の誤り'
  - expected: '恐ろしい'
    pattern: '恐しい'
    prh: 'OKURI-01 送り仮名の誤り'
  # HIRAKU 開く漢字（誤検出しにくいものだけ）
  - expected: 'でき$1'
    pattern: '/出来(る|ます|ない|た|て|れば)/'
    prh: 'HIRAKU-03 可能の「できる」は開く'
  - expected: 'ください'
    pattern: '/(?<=て|で)下さい/'
    prh: 'HIRAKU-02 補助動詞は開く'
  - expected: 'いただ$1'
    pattern: '/(?<=て|で)頂(く|き|け|いた)/'
    prh: 'HIRAKU-02 補助動詞は開く'
  - expected: 'ほしい'
    pattern: '/(?<=て|で)欲しい/'
    prh: 'HIRAKU-02 補助形容詞は開く'
  - expected: 'ほとんど'
    pattern: '殆ど'
    prh: 'HIRAKU-04 表外字は開く'
  - expected: 'あらかじめ'
    pattern: '予め'
    prh: 'HIRAKU-04'
  - expected: 'もちろん'
    pattern: '勿論'
    prh: 'HIRAKU-04'
  - expected: 'たくさん'
    pattern: '沢山'
    prh: 'HIRAKU-04'
  - expected: 'なぜ'
    pattern: '何故'
    prh: 'HIRAKU-04'
  - expected: 'いわゆる'
    pattern: '所謂'
    prh: 'HIRAKU-06'
  - expected: 'すなわち'
    pattern: '即ち'
    prh: 'HIRAKU-05'
  - expected: 'あるいは'
    pattern: '或いは'
    prh: 'HIRAKU-05'
  - expected: 'ように'
    pattern: '/(?<=の)様に/'
    prh: 'HIRAKU-01 形式名詞は開く'
  - expected: 'について'
    pattern: 'に就いて'
    prh: 'HIRAKU-07'
  - expected: 'において'
    pattern: 'に於いて'
    prh: 'HIRAKU-07'
  # GOI-03 さ入れ（代表例）
  - expected: '読ませて'
    pattern: '読まさせて'
    prh: 'GOI-03 さ入れ言葉'
  - expected: '休ませて'
    pattern: '休まさせて'
    prh: 'GOI-03 さ入れ言葉'
  # GOI-11 技術用語（必要に応じて追加）
  - expected: 'JavaScript'
    pattern: '/\bJavascript\b/'
    prh: 'GOI-11 固有名詞'
  - expected: 'GitHub'
    pattern: '/\bGithub\b/'
    prh: 'GOI-11 固有名詞'
  - expected: 'TypeScript'
    pattern: '/\bTypescript\b/'
    prh: 'GOI-11 固有名詞'
  - expected: 'macOS'
    pattern: '/\b(MacOS|Mac OS)\b/'
    prh: 'GOI-11 固有名詞'
  - expected: 'Wi-Fi'
    pattern: '/\b(WiFi|Wifi)\b/'
    prh: 'GOI-11 固有名詞'
  - expected: 'ユーザー'
    pattern: '/ユーザ(?![ーァ-ヴ])/'
    prh: 'GOI-01 長音（-er）'
  - expected: 'サーバー'
    pattern: '/サーバ(?![ーァ-ヴ])/'
    prh: 'GOI-01 長音（-er）'
  - expected: 'ブラウザー'
    pattern: '/ブラウザ(?![ーァ-ヴ])/'
    prh: 'GOI-01 長音（-er）'
  - expected: 'パラメーター'
    pattern: '/パラメータ(?![ーァ-ヴ])/'
    prh: 'GOI-01 長音（-er）'
  # GOI-10 慣用句の活用形（ICS MEDIA の辞書は終止形だけを検出するため補う）
  - expected: '的を射$1'
    pattern: '/的を得(た|て|ている|ない)/'
    prh: 'GOI-10 誤った慣用句'
  - expected: '取り付く島も'
    pattern: '取り付く暇も'
    prh: 'GOI-10 誤った慣用句'
  # GOI-05 話し言葉（文頭で使われる、誤検出しにくいもの）
  - expected: 'そのため、'
    pattern: '/(?:^|(?<=。))なので、/'
    prh: 'GOI-05 話し言葉'
  - expected: 'しかし、'
    pattern: '/(?:^|(?<=。))でも、/'
    prh: 'GOI-05 話し言葉'
  - expected: 'ではない'
    pattern: '/じゃない(?![かよ])/'
    prh: 'GOI-05 話し言葉'
  - expected: 'という'
    pattern: '/っていう/'
    prh: 'GOI-05 話し言葉'
